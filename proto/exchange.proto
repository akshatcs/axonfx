syntax = "proto3";

package axonfx;

// ClientService is the ONLY interface external clients talk to.
// Raft/consensus internals are not exposed here - a client can call any node in the cluster 
// and get a correct answer.
service ClientService {
  // Submit a cross-border transfer. Blocks until the transfer has been
  // committed by a majority of the Raft cluster and fully settled.
  rpc SubmitTransfer(SubmitTransferRequest) returns (SubmitTransferResponse);

  // Read-only balance lookup (served locally, no need to hit the leader -
  // reads are allowed to be slightly stale on followers, which is fine for
  // a "check my liquidity pools" style query).
  rpc GetBalances(GetBalancesRequest) returns (GetBalancesResponse);

  // Cluster/node health & Raft role, useful for demos ("who is leader now").
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // Transfer history (for demo/debugging visibility into what happened).
  rpc GetTransferHistory(GetHistoryRequest) returns (GetHistoryResponse);
}

message SubmitTransferRequest {
  string request_id = 1;       // client-generated idempotency key
  string source_currency = 2;  // e.g. "USD"
  string dest_currency = 3;    // e.g. "INR"
  double source_amount = 4;    // amount sender is sending, in source_currency
  string recipient_name = 5;
  string recipient_account = 6;
}

message FillDetail {
  string via_currency = 1;   // which pool/route funded this portion
  double drained_amount = 2; // units of via_currency consumed
  double produced_amount = 3;// units of dest_currency produced
  double rate = 4;
  bool used_pool_surplus = 5; // true = internal pool had it already, false = fresh forex partner call
}

message SubmitTransferResponse {
  bool success = 1;
  string request_id = 2;
  double dest_amount_paid = 3;
  double locked_rate = 4;
  double pool_covered_amount = 5;   // portion paid straight from destination pool (scenario 1)
  repeated FillDetail fills = 6;    // portion(s) sourced via routing/forex (scenario 2/3)
  string handled_by_node = 7;
  string error = 8;
  bool idempotent_replay = 9;       // true if this request_id was already processed before
}

message GetBalancesRequest {}
message GetBalancesResponse {
  map<string, double> balances = 1;
  map<string, double> fx_pnl = 2;
  string handled_by_node = 3;
}

message GetStatusRequest {}
message GetStatusResponse {
  string node_id = 1;
  string raft_state = 2;      // LEADER / FOLLOWER / CANDIDATE
  string leader_id = 3;
  bool has_quorum = 4;
  int64 raft_term = 5;
  int64 commit_index = 6;
  int64 log_len = 7;
}

message GetHistoryRequest {
  int32 limit = 1;
}
message GetHistoryResponse {
  repeated TransferRecord records = 1;
}
message TransferRecord {
  string request_id = 1;
  string source_currency = 2;
  string dest_currency = 3;
  double source_amount = 4;
  double dest_amount_paid = 5;
  double locked_rate = 6;
  string scenario = 7; // human-readable: "pool_covered" / "routed" / "routed+forex_fallback"
  double timestamp = 8;
}
